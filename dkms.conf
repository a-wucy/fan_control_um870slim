PACKAGE_NAME="minisforum-system-fan"
PACKAGE_VERSION="0.1.1"
BUILT_MODULE_NAME[0]="minisforum_system_fan"
BUILT_MODULE_LOCATION[0]="module"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make -C module KDIR=${kernel_source_dir}"
AUTOINSTALL="yes"
# Patch releases of the standard Arch kernel only; 7.3 requires review.
BUILD_EXCLUSIVE_KERNEL="^7[.]2[.][0-9]+-arch[0-9]+-[0-9]+$"
BUILD_EXCLUSIVE_ARCH="^x86_64$"
NO_WEAK_MODULES="yes"
